<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed Nawaf | Internet Speed Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box }

        :root {
            --bg: #f5f5f7; --card: #fff; --border: #e6e6e9; --soft: #f5f5f7;
            --blue: #0071e3; --blue-light: #edf5ff;
            --green: #1a8f4c; --orange: #b86e00; --red: #d70015;
            --text: #1d1d1f; --text2: #6e6e73; --text3: #86868b;
            --nav: rgba(250, 250, 252, .88);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #000; --card: #1c1c1e; --border: #2c2c2e; --soft: #2a2a2d;
                --blue: #2f8cff; --blue-light: #0f2236;
                --green: #30d158; --orange: #ff9f0a; --red: #ff453a;
                --text: #f5f5f7; --text2: #a1a1a6; --text3: #8e8e93;
                --nav: rgba(20, 20, 22, .85);
            }
        }
        :root[data-theme="dark"] {
            --bg: #000; --card: #1c1c1e; --border: #2c2c2e; --soft: #2a2a2d;
            --blue: #2f8cff; --blue-light: #0f2236;
            --green: #30d158; --orange: #ff9f0a; --red: #ff453a;
            --text: #f5f5f7; --text2: #a1a1a6; --text3: #8e8e93;
            --nav: rgba(20, 20, 22, .85);
        }

        html { scroll-behavior: smooth }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Tajawal", "Segoe UI", sans-serif;
            background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.65;
            -webkit-font-smoothing: antialiased; padding-bottom: 48px;
        }
        button, select, input { font: inherit; color: inherit }
        button, a { -webkit-tap-highlight-color: transparent }
        a { color: var(--blue); text-decoration: none }

        .apple-nav {
            position: sticky; top: 0; z-index: 1000; height: 62px; background: var(--nav);
            backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
            border-bottom: 1px solid var(--border);
        }
        .nav-content {
            height: 100%; max-width: 1160px; margin: auto; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .nav-brand { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--text) }
        .nav-actions { display: flex; gap: 8px }
        .chip-btn {
            display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border);
            background: var(--card); color: var(--text); border-radius: 50px; padding: 8px 14px;
            min-height: 38px; font-size: 12px; cursor: pointer;
        }
        .chip-btn:hover:not(:disabled) { border-color: var(--blue) }
        .chip-btn:disabled { opacity: .5; cursor: not-allowed }

        .container { max-width: 940px; padding: 32px 18px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px }
        .card {
            background: var(--card); border-radius: 24px; padding: 32px;
            border: 1px solid var(--border); text-align: center;
        }
        .card.start { text-align: start }
        h1.title { font-size: clamp(24px, 3vw, 32px); font-weight: 650; letter-spacing: -.035em; margin-bottom: 10px; text-align: center }
        h2.sec { font-size: 18px; font-weight: 650; margin-bottom: 6px }
        .desc { color: var(--text2); font-size: 15px; margin-bottom: 28px; text-align: center }
        .hint { color: var(--text3); font-size: 13px; margin-bottom: 14px }

        .gauge {
            --p: 0; width: 240px; height: 240px; border-radius: 50%; margin: 0 auto 16px;
            background: conic-gradient(var(--blue) calc(var(--p) * 1%), var(--border) 0);
            display: grid; place-items: center; padding: 10px;
        }
        .gauge-inner {
            width: 100%; height: 100%; border-radius: 50%; background: var(--blue-light);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .g-tag { font-size: 12px; color: var(--text3); font-weight: 600; min-height: 18px }
        .g-val { font-size: 48px; font-weight: 700; color: var(--blue); line-height: 1.1; font-variant-numeric: tabular-nums; direction: ltr }
        .g-unit { font-size: 13px; color: var(--text3); text-transform: uppercase; font-weight: 600; letter-spacing: .05em }
        .status { min-height: 26px; margin-bottom: 18px; color: var(--text2); font-weight: 500 }
        .status.error { color: var(--red) }

        .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap }
        .pill-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px 32px; min-height: 50px; border-radius: 50px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all .2s; border: 1px solid var(--blue); background: var(--blue); color: #fff;
        }
        .pill-btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px) }
        .pill-btn:disabled { opacity: .55; cursor: not-allowed }
        .pill-btn.secondary { background: var(--card); color: var(--text); border-color: var(--border) }
        .pill-btn.danger { background: var(--card); color: var(--red); border-color: var(--red) }

        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-top: 28px }
        .metric { background: var(--soft); padding: 16px 12px; border-radius: 18px; border: 1px solid var(--border) }
        .m-title { font-size: 12px; color: var(--text3); font-weight: 600; margin-bottom: 6px }
        .m-val { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: plaintext }
        .m-sub { font-size: 12px; color: var(--text3); min-height: 18px; direction: ltr; unicode-bidi: plaintext }

        .warns { list-style: none; margin-top: 18px; text-align: start; display: none }
        .warns.show { display: block }
        .warns li { color: var(--orange); font-size: 13px; padding: 4px 0 }
        .warns li::before { content: "⚠ " }

        canvas#chart { width: 100%; height: 230px; display: block }
        .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text2); margin-top: 10px; justify-content: center }
        .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px }

        .use-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 14px }
        .use { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: var(--soft); border: 1px solid var(--border); font-size: 14px }
        .badge { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 20px; border: 1px solid currentColor; white-space: nowrap }
        .badge.ok { color: var(--green) } .badge.warn { color: var(--orange) } .badge.bad { color: var(--red) }

        details.card > summary { cursor: pointer; font-size: 18px; font-weight: 650; list-style: none; display: flex; justify-content: space-between; align-items: center }
        details.card > summary::-webkit-details-marker { display: none }
        details.card > summary::after { content: "▾"; color: var(--text3) }
        details.card[open] > summary::after { content: "▴" }
        details.card .body { margin-top: 18px }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px }
        .field label.lbl { display: block; font-size: 13px; color: var(--text2); margin-bottom: 4px; font-weight: 600 }
        select {
            width: 100%; min-height: 42px; padding: 8px 12px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--soft); cursor: pointer;
        }
        select:disabled, input:disabled { opacity: .55; cursor: not-allowed }
        .checks { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 4px }
        .checks label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px }
        input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--blue) }
        .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px }

        .tbl-wrap { overflow-x: auto }
        table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums }
        th, td { padding: 8px 10px; text-align: start; border-bottom: 1px solid var(--border); white-space: nowrap }
        th { color: var(--text3); font-weight: 600 }
        td.val { direction: ltr; unicode-bidi: plaintext; text-align: start; white-space: normal }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px }
        .empty { color: var(--text3); padding: 14px 0 }

        .notes { font-size: 13px; color: var(--text2); line-height: 1.9; padding-inline-start: 18px }
        .notes li { margin-bottom: 4px }

        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 30px;
            font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 2000;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) }
        footer { text-align: center; font-size: 13px; color: var(--text3); margin-top: 8px }

        @media (max-width: 600px) {
            .container { padding: 18px 12px }
            .card { padding: 22px 16px }
            .gauge { width: 210px; height: 210px }
            .g-val { font-size: 40px }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important } }
    </style>
</head>

<body>
    <header class="apple-nav">
        <div class="nav-content">
            <a class="nav-brand" href="#">
                <i class="fas fa-gauge-high" style="color: var(--blue);"></i>
                <span data-i18n="brand"></span>
            </a>
            <div class="nav-actions">
                <button type="button" class="chip-btn" id="themeBtn" aria-label="Theme"><i class="fas fa-circle-half-stroke"></i></button>
                <button type="button" class="chip-btn" id="langBtn"><i class="fas fa-globe"></i><span id="langLabel"></span></button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Main test -->
        <section class="card">
            <h1 class="title" data-i18n="title"></h1>
            <p class="desc" data-i18n="desc"></p>

            <div class="gauge" id="gauge">
                <div class="gauge-inner">
                    <div class="g-tag" id="gTag"></div>
                    <div class="g-val" id="gVal">0.00</div>
                    <div class="g-unit" id="gUnit">Mbps</div>
                </div>
            </div>
            <div class="status" id="status" role="status" aria-live="polite"></div>

            <div class="btn-row">
                <button type="button" class="pill-btn" id="startBtn"><i class="fas fa-play"></i><span id="startLabel"></span></button>
                <button type="button" class="pill-btn danger" id="cancelBtn" hidden><i class="fas fa-stop"></i><span data-i18n="cancel"></span></button>
            </div>

            <div class="metrics">
                <div class="metric"><div class="m-title" data-i18n="m_ping"></div><div class="m-val" id="pingVal">--</div><div class="m-sub" id="pingSub"></div></div>
                <div class="metric"><div class="m-title" data-i18n="m_jitter"></div><div class="m-val" id="jitterVal">--</div><div class="m-sub"></div></div>
                <div class="metric"><div class="m-title" data-i18n="m_down"></div><div class="m-val" id="downVal">--</div><div class="m-sub" id="downSub"></div></div>
                <div class="metric"><div class="m-title" data-i18n="m_up"></div><div class="m-val" id="upVal">--</div><div class="m-sub" id="upSub"></div></div>
                <div class="metric"><div class="m-title" data-i18n="m_ld"></div><div class="m-val" id="ldVal">--</div><div class="m-sub" id="ldSub"></div></div>
                <div class="metric"><div class="m-title" data-i18n="m_lu"></div><div class="m-val" id="luVal">--</div><div class="m-sub" id="luSub"></div></div>
                <div class="metric"><div class="m-title" data-i18n="m_bb"></div><div class="m-val" id="bbVal">--</div><div class="m-sub" id="bbSub"></div></div>
                <div class="metric"><div class="m-title" data-i18n="m_data"></div><div class="m-val" id="dataVal">--</div><div class="m-sub" id="dataSub"></div></div>
            </div>
            <ul class="warns" id="warns"></ul>
        </section>

        <!-- Live chart -->
        <section class="card start">
            <h2 class="sec" data-i18n="chartTitle"></h2>
            <p class="hint" data-i18n="chartHint"></p>
            <canvas id="chart" role="img" aria-label="Speed chart"></canvas>
            <div class="legend">
                <span><i style="background: var(--blue)"></i><span data-i18n="m_down"></span></span>
                <span><i style="background: var(--green)"></i><span data-i18n="m_up"></span></span>
                <span><i style="background: var(--text3); opacity: .35"></i><span data-i18n="legendWarm"></span></span>
            </div>
        </section>

        <!-- Suitability -->
        <section class="card start" id="useCard" hidden>
            <h2 class="sec" data-i18n="useTitle"></h2>
            <p class="hint" data-i18n="useHint"></p>
            <div class="use-list" id="useList"></div>
        </section>

        <!-- Settings -->
        <details class="card start" open>
            <summary data-i18n="setTitle"></summary>
            <div class="body">
                <p class="hint" data-i18n="presetsLbl"></p>
                <div class="presets">
                    <button type="button" class="chip-btn" data-preset="quick" data-i18n="pQuick"></button>
                    <button type="button" class="chip-btn" data-preset="std" data-i18n="pStd"></button>
                    <button type="button" class="chip-btn" data-preset="deep" data-i18n="pDeep"></button>
                    <button type="button" class="chip-btn" data-preset="reset" data-i18n="pReset"></button>
                </div>
                <div class="form-grid">
                    <div class="field"><label class="lbl" for="optDuration" data-i18n="o_duration"></label><select id="optDuration"></select></div>
                    <div class="field"><label class="lbl" for="optStreams" data-i18n="o_streams"></label><select id="optStreams"></select></div>
                    <div class="field"><label class="lbl" for="optCap" data-i18n="o_cap"></label><select id="optCap"></select></div>
                    <div class="field"><label class="lbl" for="optUnit" data-i18n="o_unit"></label><select id="optUnit"></select></div>
                    <div class="field"><label class="lbl" for="optTheme" data-i18n="o_theme"></label><select id="optTheme"></select></div>
                </div>
                <div class="field" style="margin-top:16px">
                    <span class="lbl" style="font-size:13px;color:var(--text2);font-weight:600" data-i18n="o_tests"></span>
                    <div class="checks">
                        <label><input type="checkbox" id="tPing"><span data-i18n="t_ping"></span></label>
                        <label><input type="checkbox" id="tDown"><span data-i18n="t_down"></span></label>
                        <label><input type="checkbox" id="tUp"><span data-i18n="t_up"></span></label>
                        <label><input type="checkbox" id="tLoaded"><span data-i18n="t_loaded"></span></label>
                        <label><input type="checkbox" id="optHistory"><span data-i18n="o_history"></span></label>
                    </div>
                </div>
            </div>
        </details>

        <!-- History -->
        <details class="card start">
            <summary data-i18n="hTitle"></summary>
            <div class="body">
                <div class="tbl-wrap" id="histWrap"></div>
                <div class="actions">
                    <button type="button" class="chip-btn" id="copyBtn"><i class="fas fa-copy"></i><span data-i18n="hCopy"></span></button>
                    <button type="button" class="chip-btn" id="csvBtn"><i class="fas fa-file-csv"></i><span data-i18n="hCsv"></span></button>
                    <button type="button" class="chip-btn" id="jsonBtn"><i class="fas fa-file-code"></i><span data-i18n="hJson"></span></button>
                    <button type="button" class="chip-btn" id="clearBtn"><i class="fas fa-trash"></i><span data-i18n="hClear"></span></button>
                </div>
            </div>
        </details>

        <!-- Details / proof -->
        <details class="card start">
            <summary data-i18n="dTitle"></summary>
            <div class="body">
                <p class="hint" data-i18n="dDesc"></p>
                <div class="tbl-wrap"><table><tbody id="detailsBody"></tbody></table></div>
            </div>
        </details>

        <!-- Notes -->
        <section class="card start">
            <h2 class="sec" data-i18n="nTitle"></h2>
            <ul class="notes" id="notesList"></ul>
        </section>

        <footer><p><span data-i18n="footer"></span>  <a href="mailto:mbnq1@outlook.com">mbnq1@outlook.com</a></p></footer>
    </main>
    <div class="toast" id="toast"></div>

    <script>
    (() => {
        'use strict';

        // ============================================================
        //  Constants
        // ============================================================
        const BASE = 'https://speed.cloudflare.com';
        const CHUNK_DOWN = 50000000;  // bytes per download request (aborted when the test ends)
        const CHUNK_UP = 16000000;    // bytes per upload request
        const PING_SAMPLES = 20;
        const HISTORY_MAX = 100;
        const CANCEL = Symbol('cancel');

        const DEFAULTS = {
            lang: 'ar', theme: 'auto', unit: 'Mbps',
            duration: 10, streams: 4, cap: 0, history: true,
            tests: { ping: true, down: true, up: true, loaded: true }
        };
        const PRESETS = {
            quick: { duration: 5, streams: 4, cap: 100 },
            std: { duration: 10, streams: 4, cap: 0 },
            deep: { duration: 20, streams: 8, cap: 0 }
        };
        const UNITS = { Mbps: { f: 1, label: 'Mbps' }, MBps: { f: 1 / 8, label: 'MB/s' }, Gbps: { f: 1 / 1000, label: 'Gbps' } };

        // ============================================================
        //  Helpers
        // ============================================================
        const $ = id => document.getElementById(id);
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const store = {
            get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
            set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
        };
        const median = a => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
        const fmtN = n => n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n >= 1 ? n.toFixed(2) : n.toFixed(3);
        const fmtMs = v => v < 10 ? v.toFixed(1) : String(Math.round(v));
        const fmtBytes = b => b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : (b / 1e6).toFixed(b >= 1e8 ? 0 : 1) + ' MB';

        // ============================================================
        //  State
        // ============================================================
        let settings = mergeSettings(store.get('speedtest.settings', {}));
        let state = 'idle';       // idle | running | done | error | cancelled
        let phase = null;         // server | ping | down | up
        let run = null;
        let lastResult = null;
        let lastWarns = [];
        let chart = { down: [], up: [], downWarm: null, upWarm: null };

        function mergeSettings(s) {
            const m = JSON.parse(JSON.stringify(DEFAULTS));
            if (!s || typeof s !== 'object') return m;
            for (const k of ['lang', 'theme', 'unit']) if (typeof s[k] === 'string') m[k] = s[k];
            for (const k of ['duration', 'streams', 'cap']) if (typeof s[k] === 'number' && isFinite(s[k]) && s[k] >= 0) m[k] = s[k];
            if (typeof s.history === 'boolean') m.history = s.history;
            if (s.tests && typeof s.tests === 'object') for (const k of Object.keys(m.tests)) if (typeof s.tests[k] === 'boolean') m.tests[k] = s.tests[k];
            if (!UNITS[m.unit]) m.unit = 'Mbps';
            if (!['ar', 'en'].includes(m.lang)) m.lang = 'ar';
            if (!['auto', 'light', 'dark'].includes(m.theme)) m.theme = 'auto';
            return m;
        }
        const saveSettings = () => store.set('speedtest.settings', settings);

        // ============================================================
        //  i18n
        // ============================================================
        const T = {
            ar: {
                brand: 'قياس سرعة الإنترنت',
                title: 'اختبار سرعة الاتصال بالإنترنت',
                desc: 'قياس سرعة التنزيل والرفع وزمن الاستجابة.',
                start: 'بدء الاختبار', again: 'إعادة الاختبار', cancel: 'إلغاء',
                ready: 'جاهز للاختبار',
                s_server: 'جاري تحديد الخادم...', s_ping: 'جاري قياس الاستجابة...',
                s_down: 'جاري قياس التنزيل...', s_up: 'جاري قياس الرفع...',
                done: 'اكتمل الاختبار',
                cancelled: 'تم إلغاء الاختبار.',
                errAll: 'تعذّر الاتصال بخادم الاختبار. تأكد من الإنترنت وأوقف الـ VPN أو مانع الإعلانات ثم أعد المحاولة.',
                pickOne: 'اختر اختباراً واحداً على الأقل من الخيارات.',
                tag_server: 'الخادم', tag_ping: 'Ping', tag_down: '↓ التنزيل', tag_up: '↑ الرفع',
                m_ping: 'الاستجابة (Ping)', m_jitter: 'التذبذب (Jitter)', m_down: 'التنزيل', m_up: 'الرفع',
                m_ld: 'الاستجابة أثناء التنزيل', m_lu: 'الاستجابة أثناء الرفع',
                m_bb: 'الاستقرار تحت الحمل', m_data: 'البيانات المستهلكة',
                peak: 'الذروة', range: 'المدى', grade: 'التقييم',
                w_fail_ping: 'فشل قياس الاستجابة (Ping).',
                w_fail_down: 'فشل قياس التنزيل.',
                w_fail_up: 'فشل قياس الرفع.',
                w_hidden: 'كانت الصفحة في الخلفية أثناء الاختبار، فقد تكون النتائج غير دقيقة. أعد الاختبار والصفحة ظاهرة.',
                w_short: 'مدة القياس الفعلية أقل من 3 ثوانٍ بسبب حد البيانات، فالنتيجة أقل دقة.',

                try { const r = await fetch(url(), { cache: 'no-store', signal: c.signal }); await r.arrayBuffer(); return performance.now() - s; }
                finally { clearTimeout(to); }
            };
            await one(6000); // warm-up: DNS + TLS handshake excluded; throws if the server is unreachable
            const times = []; let lost = 0;
            for (let i = 0; i < PING_SAMPLES; i++) {
                checkCancel();
                try { const v = await one(2500); times.push(v); onSample(v); } catch (e) { lost++; }
                setFrac((i + 1) / PING_SAMPLES);
                await sleep(30);
            }
            if (times.length < 5) throw new Error('too few ping samples');
            let j = 0; for (let i = 1; i < times.length; i++) j += Math.abs(times[i] - times[i - 1]);
            return { median: median(times), min: Math.min(...times), max: Math.max(...times), jitter: j / (times.length - 1), lost, total: PING_SAMPLES, n: times.length };
        }

        // Latency measured on a parallel request while the link is saturated (bufferbloat).
        function startProbe() {
            let active = true; const times = [], t0 = performance.now();
            (async () => {
                while (active) {
                    const s = performance.now();
                    try {
                        const r = await fetch(`${BASE}/__down?bytes=0&r=${Math.random()}`, { cache: 'no-store' }); await r.arrayBuffer();
                        if (active && s - t0 > 1500) times.push(performance.now() - s);
                    } catch (e) { /* ignore */ }
                    await sleep(200);
                }
            })();
            return { stop() { active = false; return times.length >= 3 ? median(times) : null; } };
        }

        async function measureDownload(o, onLive, setFrac) {
            const meter = createMeter(o.duration * 1000, onLive);
            const ctrl = new AbortController();
            let stop = false, failed = 0, ok = 0;
            const stopNow = () => { if (stop) return; stop = true; meter.freeze(); ctrl.abort(); };
            run.aborts.add(stopNow);
            const timer = setTimeout(stopNow, o.duration * 1000);
            const prog = setInterval(() => {
                const f = (performance.now() - meter.t0) / (o.duration * 1000), cp = o.cap ? meter.bytes / (o.cap * 1e6) : 0;
                setFrac(Math.min(1, Math.max(f, cp)));
            }, 100);
            const worker = async () => {
                while (!stop) {
                    try {
                        const r = await fetch(`${BASE}/__down?bytes=${CHUNK_DOWN}&r=${Math.random()}`, { cache: 'no-store', signal: ctrl.signal });
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        const rd = r.body.getReader();
                        for (;;) {
                            const { done, value } = await rd.read();
                            if (done) break;
                            ok += value.length; meter.add(value.length);
                            if (o.cap && meter.bytes >= o.cap * 1e6) { meter.markCap(); stopNow(); return; }
                        }
                    } catch (e) { if (stop) return; if (++failed > 3) throw e; }
                }
            };
            try { await Promise.all(Array.from({ length: o.streams }, worker)); }
            finally { clearTimeout(timer); clearInterval(prog); run.aborts.delete(stopNow); stopNow(); }
            if (ok === 0) throw new Error('no data');
            return { ...meter.result(), streams: o.streams };
        }

        async function measureUpload(o, onLive, setFrac) {
            const meter = createMeter(o.duration * 1000, onLive);
            const payload = makePayload(CHUNK_UP), streams = Math.min(o.streams, 8);
            let stop = false, failed = 0, ok = 0;
            const active = new Set();
            const stopNow = () => { if (stop) return; stop = true; meter.freeze(); active.forEach(x => x.abort()); };
            run.aborts.add(stopNow);
            const timer = setTimeout(stopNow, o.duration * 1000);
            const prog = setInterval(() => {
                const f = (performance.now() - meter.t0) / (o.duration * 1000), cp = o.cap ? meter.bytes / (o.cap * 1e6) : 0;
                setFrac(Math.min(1, Math.max(f, cp)));
            }, 100);
            const sendOne = () => new Promise((res, rej) => {
                const x = new XMLHttpRequest(); active.add(x); let last = 0;
                x.open('POST', `${BASE}/__up?r=${Math.random()}`);
                x.upload.onprogress = e => {
                    const d = e.loaded - last; last = e.loaded; ok += d; meter.add(d);
                    if (o.cap && meter.bytes >= o.cap * 1e6) { meter.markCap(); stopNow(); }
                };
                x.onload = () => { active.delete(x); x.status >= 400 ? rej(new Error('HTTP ' + x.status)) : res(); };
                x.onabort = () => { active.delete(x); res(); };
                x.onerror = x.ontimeout = () => { active.delete(x); rej(new Error('upload failed')); };
                x.send(payload);
            });
            const worker = async () => {
                while (!stop) { try { await sendOne(); } catch (e) { if (stop) return; if (++failed > 3) throw e; } }
            };
            try { await Promise.all(Array.from({ length: streams }, worker)); }
            finally { clearTimeout(timer); clearInterval(prog); run.aborts.delete(stopNow); stopNow(); }
            if (ok === 0) throw new Error('no data');
            return { ...meter.result(), streams };
        }

        // Informational only (never used in any calculation). Failure is silent.
        async function fetchServerInfo() {
            const get = async (path, json) => {
                const c = new AbortController(), to = setTimeout(() => c.abort(), 4000);
                try { const r = await fetch(BASE + path, { cache: 'no-store', signal: c.signal }); if (!r.ok) return null; return json ? await r.json() : await r.text(); }
                catch (e) { return null; } finally { clearTimeout(to); }
            };
            const out = {};
            const m = await get('/meta', true);
            if (m && typeof m === 'object') {
                const colo = m.colo && typeof m.colo === 'object' ? (m.colo.iata || m.colo.city) : m.colo;
                const where = [m.city || (m.colo && m.colo.city), colo, m.country].filter((v, i, a) => v && a.indexOf(v) === i).join(' · ');
                if (where) out.where = where;
                if (m.asOrganization) out.isp = String(m.asOrganization);
                if (m.clientIp) out.ip = String(m.clientIp);
            }
            if (!out.where) {
                const tx = await get('/cdn-cgi/trace', false);
                if (tx) {
                    const kv = Object.fromEntries(tx.split('\n').map(l => l.split('=')).filter(a => a.length === 2));
                    const where = [kv.colo, kv.loc].filter(Boolean).join(' · ');
                    if (where) out.where = where;
                    if (kv.ip && !out.ip) out.ip = kv.ip;
                }
            }
            return Object.keys(out).length ? out : null;
        }

        const bbGrade = d => d < 30 ? 'A' : d < 60 ? 'B' : d < 150 ? 'C' : d < 400 ? 'D' : 'F';

        // ============================================================
        //  Test flow
        // ============================================================
        function setProgress(frac) {
            const n = run ? run.planned.length : 1;
            const p = Math.min(100, ((run ? run.done : 0) + frac) / n * 100);
            $('gauge').style.setProperty('--p', p.toFixed(1));
        }
        function setPhase(p) { phase = p; renderStatus(); }

        async function startTest() {
            if (state === 'running') return;
            const tests = settings.tests;
            const planned = [...(tests.ping ? ['ping'] : []), ...(tests.down ? ['down'] : []), ...(tests.up ? ['up'] : [])];
            if (!planned.length) { toast(t('pickOne')); return; }

            run = { cancelled: false, aborts: new Set(), planned, done: 0, hidden: document.hidden };
            state = 'running'; lastResult = null; lastWarns = []; chart = { down: [], up: [], downWarm: null, upWarm: null };
            $('startBtn').hidden = true; $('cancelBtn').hidden = false; setLocked(true);
            $('gauge').style.setProperty('--p', '0'); $('gVal').textContent = '0.00'; $('gUnit').textContent = unitLabel();
            setPhase('server'); renderWarns(); renderResult();

            const o = { duration: settings.duration, streams: settings.streams, cap: settings.cap };
            const res = { ts: Date.now(), duration: o.duration, streams: o.streams, cap: o.cap, server: null, ping: null, down: null, up: null, ldDown: null, ldUp: null, bb: null };
            const warns = [];
            let okCount = 0;

            const guarded = async (name, fn) => {
                checkCancel(); setPhase(name);
                try { const r = await fn(); checkCancel(); okCount++; return r; }
                catch (e) {
                    if (e === CANCEL || run.cancelled) throw CANCEL;
                    console.error(name, e); warns.push('fail_' + name); return null;
                } finally { run.done++; }
            };

            try {
                res.server = await fetchServerInfo(); checkCancel();

                if (tests.ping) {
                    res.ping = await guarded('ping', () => measurePing(v => { $('gVal').textContent = fmtMs(v); $('gUnit').textContent = 'ms'; }, setProgress));
                    if (res.ping) { $('gVal').textContent = fmtMs(res.ping.median); renderResultLive(res); }
                }
                if (tests.down) {
                    $('gUnit').textContent = unitLabel();
                    const probe = tests.loaded ? startProbe() : null;
                    try {
                        res.down = await guarded('down', () => measureDownload(o, (v, ts) => {
                            $('gVal').textContent = fmtSpeed(v); chart.down.push([ts, v]); drawChart();
                        }, setProgress));
                    } finally { if (probe) res.ldDown = probe.stop(); }
                    if (res.down) {
                        chart.downWarm = [0, res.down.warmSec]; chart.upOffset = res.down.elapsedSec + 1;
                        $('gVal').textContent = fmtSpeed(res.down.mbps);
                        if (tests.loaded && res.ldDown == null) warns.push('noProbe');
                        renderResultLive(res);
                    }
                }
                if (tests.up) {
                    $('gUnit').textContent = unitLabel();
                    const off = chart.upOffset || 0;
                    const probe = tests.loaded ? startProbe() : null;
                    try {
                        res.up = await guarded('up', () => measureUpload(o, (v, ts) => {
                            $('gVal').textContent = fmtSpeed(v); chart.up.push([off + ts, v]); drawChart();
                        }, setProgress));
                    } finally { if (probe) res.ldUp = probe.stop(); }
                    if (res.up) {
                        chart.upWarm = [off, off + res.up.warmSec];
                        if (tests.loaded && res.ldUp == null) warns.push('noProbe');
                        renderResultLive(res);
                    }
                }

                if (okCount === 0) { state = 'error'; lastResult = null; }
                else {
                    if (res.ping && (res.ldDown != null || res.ldUp != null)) {
                        const worst = Math.max(res.ldDown != null ? res.ldDown : 0, res.ldUp != null ? res.ldUp : 0);
                        const delta = Math.max(0, worst - res.ping.median);
                        res.bb = { grade: bbGrade(delta), delta };
                    }
                    if (run.hidden) warns.push('hidden');
                    if ((res.down && res.down.windowSec < 3) || (res.up && res.up.windowSec < 3)) warns.push('short');
                    if ((res.down && res.down.capHit) || (res.up && res.up.capHit)) warns.push('capHit');
                    state = 'done'; lastResult = res;
                    saveHistory(res);
                }
            } catch (e) {
                if (e === CANCEL) { state = 'cancelled'; lastResult = null; lastWarns = []; chart = { down: [], up: [], downWarm: null, upWarm: null }; }
                else { console.error(e); state = 'error'; lastResult = null; }
            }

            lastWarns = state === 'done' ? [...new Set(warns)] : [];
            run = null; phase = null;
            $('gauge').style.setProperty('--p', state === 'done' ? '100' : '0');
            $('startBtn').hidden = false; $('cancelBtn').hidden = true; setLocked(false);
            renderStatus(); renderWarns(); renderResult(); renderHistory();
            if (state !== 'done') { $('gVal').textContent = '0.00'; $('gUnit').textContent = unitLabel(); }
        }

        // Show finished phases while the test continues
        function renderResultLive(res) {
            const keep = lastResult; lastResult = res; const s = state; state = 'running';
            renderResult(); state = s; lastResult = keep;
        }

        function cancelTest() {
            if (!run) return;
            run.cancelled = true;
            run.aborts.forEach(f => { try { f(); } catch (e) { /* ignore */ } });
        }

        document.addEventListener('visibilitychange', () => { if (run && document.hidden) run.hidden = true; });

        // ============================================================
        //  History / export
        // ============================================================
        function saveHistory(r) {
            if (!settings.history) return;
            const h = store.get('speedtest.history', []);
            h.unshift({
                ts: r.ts, ping: r.ping ? r.ping.median : null, jitter: r.ping ? r.ping.jitter : null,
                down: r.down ? r.down.mbps : null, up: r.up ? r.up.mbps : null,
                ld: r.ldDown, lu: r.ldUp, bb: r.bb ? r.bb.grade : null,
                server: r.server && r.server.where ? r.server.where : null, duration: r.duration, streams: r.streams
            });
            store.set('speedtest.history', h.slice(0, HISTORY_MAX));
        }
        function download(name, text, type) {
            const a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type }));
            a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
        function summaryText(e) {
            const U = unitLabel(), d = new Date(e.ts).toLocaleString(settings.lang === 'ar' ? 'ar-SA-u-ca-gregory' : 'en-GB');
            const parts = [];
            if (e.down != null) parts.push(`${t('m_down')}: ${fmtSpeed(e.down)} ${U}`);
            if (e.up != null) parts.push(`${t('m_up')}: ${fmtSpeed(e.up)} ${U}`);
            if (e.ping != null) parts.push(`Ping: ${fmtMs(e.ping)} ms`);
            if (e.jitter != null) parts.push(`Jitter: ${e.jitter.toFixed(1)} ms`);
            if (e.bb) parts.push(`${t('m_bb')}: ${e.bb}`);
            return `${t('brand')} — ${d}\n${parts.join(' | ')}${e.server ? `\n${t('hServer')}: ${e.server}` : ''}`;
        }
        async function copyLast() {
            const h = store.get('speedtest.history', []);
            const e = lastResult ? {
                ts: lastResult.ts, ping: lastResult.ping ? lastResult.ping.median : null, jitter: lastResult.ping ? lastResult.ping.jitter : null,
                down: lastResult.down ? lastResult.down.mbps : null, up: lastResult.up ? lastResult.up.mbps : null,
                bb: lastResult.bb ? lastResult.bb.grade : null, server: lastResult.server ? lastResult.server.where : null
            } : h[0];
            if (!e) { toast(t('nothing')); return; }
            try { await navigator.clipboard.writeText(summaryText(e)); toast(t('copied')); } catch (err) { toast(t('copyFail')); }
        }
        function exportCsv() {
            const h = store.get('speedtest.history', []); if (!h.length) { toast(t('nothing')); return; }
            const q = v => v == null ? '' : `"${String(v).replace(/"/g, '""')}"`;
            const rows = ['timestamp_iso,ping_ms,jitter_ms,download_mbps,upload_mbps,loaded_latency_down_ms,loaded_latency_up_ms,bufferbloat_grade,server,duration_s,connections'];
            h.forEach(e => rows.push([q(new Date(e.ts).toISOString()), e.ping != null ? e.ping.toFixed(2) : '', e.jitter != null ? e.jitter.toFixed(2) : '', e.down != null ? e.down.toFixed(2) : '', e.up != null ? e.up.toFixed(2) : '', e.ld != null ? e.ld.toFixed(2) : '', e.lu != null ? e.lu.toFixed(2) : '', q(e.bb), q(e.server), e.duration ?? '', e.streams ?? ''].join(',')));
            download('speedtest-history.csv', '﻿' + rows.join('\n'), 'text/csv;charset=utf-8');
        }
        function exportJson() {
            const h = store.get('speedtest.history', []); if (!h.length) { toast(t('nothing')); return; }
            download('speedtest-history.json', JSON.stringify(h.map(e => ({ ...e, timestamp_iso: new Date(e.ts).toISOString() })), null, 2), 'application/json');
        }

        // ============================================================
        //  Events
        // ============================================================
        $('startBtn').addEventListener('click', startTest);
        $('cancelBtn').addEventListener('click', cancelTest);
        $('langBtn').addEventListener('click', () => { settings.lang = settings.lang === 'ar' ? 'en' : 'ar'; saveSettings(); applyLanguage(); });
        $('themeBtn').addEventListener('click', () => {
            const order = ['auto', 'light', 'dark']; settings.theme = order[(order.indexOf(settings.theme) + 1) % 3];
            saveSettings(); applyTheme(); $('optTheme').value = settings.theme; drawChart(); toast(t('theme_' + settings.theme));
        });
        $('optDuration').addEventListener('change', e => { settings.duration = +e.target.value; saveSettings(); });
        $('optStreams').addEventListener('change', e => { settings.streams = +e.target.value; saveSettings(); });
        $('optCap').addEventListener('change', e => { settings.cap = +e.target.value; saveSettings(); });
        $('optUnit').addEventListener('change', e => { settings.unit = e.target.value; saveSettings(); if (state !== 'running') { $('gUnit').textContent = unitLabel(); } renderHistory(); renderResult(); });
        $('optTheme').addEventListener('change', e => { settings.theme = e.target.value; saveSettings(); applyTheme(); drawChart(); });
        [['tPing', 'ping'], ['tDown', 'down'], ['tUp', 'up'], ['tLoaded', 'loaded']].forEach(([id, k]) => $(id).addEventListener('change', e => { settings.tests[k] = e.target.checked; saveSettings(); }));
        $('optHistory').addEventListener('change', e => { settings.history = e.target.checked; saveSettings(); });
        document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
            const p = b.dataset.preset;
            if (p === 'reset') { const lang = settings.lang; settings = mergeSettings({}); settings.lang = lang; }
            else Object.assign(settings, PRESETS[p]);
            saveSettings(); applyTheme(); buildSelects(); syncControls(); renderResult(); renderHistory();
        }));
        $('copyBtn').addEventListener('click', copyLast);
        $('csvBtn').addEventListener('click', exportCsv);
        $('jsonBtn').addEventListener('click', exportJson);
        $('clearBtn').addEventListener('click', () => { store.set('speedtest.history', []); renderHistory(); toast(t('cleared')); });
        window.addEventListener('resize', drawChart);

        // ============================================================
        //  Init
        // ============================================================
        applyTheme();
        applyLanguage();
        window.__speedtest = { startTest, cancelTest, getState: () => ({ state, lastResult, lastWarns }) }; // handy for debugging
    })();
    </script>
</body>
